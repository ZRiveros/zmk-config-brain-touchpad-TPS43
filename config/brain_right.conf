# Pointing / trackpad
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y

# Stack sizes (I2C polling needs headroom)
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=4096

# Debug logging (remove after touchpad works)
CONFIG_LOG=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
